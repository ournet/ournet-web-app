# ---------------------------------------------------------------------------
# http-level settings (this file is included from inside the http {} block)
# ---------------------------------------------------------------------------

# Hide "nginx/1.18.0 (Ubuntu)" from Server header and error pages
server_tokens off;

# Slowloris / idle-connection protection
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
keepalive_timeout 30s;

# Per-IP rate limiting. Assets are on a CDN, so nginx only sees page/API
# requests. Mobile carriers NAT many users behind one IP, hence the burst.
limit_req_zone $binary_remote_addr zone=ournet_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ournet_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# AI training crawlers. Blocked at nginx because some of them (Bytespider,
# Amazonbot, PetalBot) ignore robots.txt. Search / user-triggered fetchers
# (OAI-SearchBot, ChatGPT-User, Claude-SearchBot, PerplexityBot) are allowed:
# they cite pages and send visitors.
map $http_user_agent $ournet_block_ua {
  default 0;
  "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Bytespider|meta-externalagent|FacebookBot|Amazonbot|PetalBot|Applebot-Extended|Diffbot|omgili|ImagesiftBot|Timpibot|cohere-ai|YouBot)" 1;
}

# ---------------------------------------------------------------------------
# Catch-all: bare IP, unknown Host headers, scanners. 444 drops the connection.
# ---------------------------------------------------------------------------
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/ournet/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ournet/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 444;
}

# ---------------------------------------------------------------------------
# Main web app
# ---------------------------------------------------------------------------
server {
  server_name horoscop.click.md horoscop.ournet.ro horoscope.our.bg horoscope.ournet.in
    horoskop.ournet.cz horoszkop.ournet.hu idojaras.ournet.hu meteo.click.md
    meteo.ournet.it meteo.ournet.ro news.click.md news.our.bg
    news.ournet.cz news.ournet.hu news.ournet.in news.ournet.it news.ournet.ro
    noticias.ournet.es oroscopo.ournet.it pocasi.ournet.cz tiempo.ournet.es
    vremeto.our.bg weather.ournet.in www.click.md www.hava.one www.meteo.ng
    www.meteo2.kz www.moti2.al www.our.bg www.ournet.cz www.ournet.es www.ournet.hu
    www.ournet.in www.ournet.it www.ournet.ro www.thoi.vn www.vremenska.rs www.vrijeme.one;
  client_max_body_size 5M;

  limit_req zone=ournet_req burst=40 nodelay;
  limit_conn ournet_conn 30;

  # No X-Frame-Options: weather widgets and video embeds are meant to be iframed elsewhere.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  if ($ournet_block_ua) {
    return 403;
  }

  # Drop common vulnerability probes before they reach Node
  location ~* (\.php$|\.aspx?$|\.env|\.git|/wp-admin|/wp-login|/wp-includes|/xmlrpc\.php|/phpmyadmin|/cgi-bin/) {
    return 444;
  }

  location / {
    proxy_redirect off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass http://localhost:41843;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/ournet/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ournet/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  gzip on;
  gzip_vary on;
}

# ---------------------------------------------------------------------------
# apex -> www redirect
# ---------------------------------------------------------------------------
server {
  server_name click.md ournet.ro our.bg ournet.in ournet.cz ournet.hu ournet.it
    ournet.es hava.one meteo.ng meteo2.kz moti2.al thoi.vn vremenska.rs vrijeme.one;

  return 301 https://www.$host$request_uri;

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/ournet/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ournet/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---------------------------------------------------------------------------
# http -> https redirect
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name click.md *.click.md ournet.ro *.ournet.ro our.bg *.our.bg ournet.in
    *.ournet.in ournet.cz *.ournet.cz ournet.hu *.ournet.hu ournet.it *.ournet.it
    ournet.es *.ournet.es hava.one *.hava.one meteo.ng *.meteo.ng meteo2.kz *.meteo2.kz
    moti2.al *.moti2.al thoi.vn *.thoi.vn vremenska.rs *.vremenska.rs vrijeme.one *.vrijeme.one;

  return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# curs (exchange rates) app
# ---------------------------------------------------------------------------
server {
  server_name curs.click.md curs.ournet.ro;

  limit_req zone=ournet_req burst=40 nodelay;
  limit_conn ournet_conn 30;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  if ($ournet_block_ua) {
    return 403;
  }

  location ~* (\.php$|\.aspx?$|\.env|\.git|/wp-admin|/wp-login|/wp-includes|/xmlrpc\.php|/phpmyadmin|/cgi-bin/) {
    return 444;
  }

  location / {
    proxy_redirect off;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Host $http_host;
    proxy_set_header   X-NginX-Proxy      true;
    proxy_set_header   Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass  http://localhost:4201;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/ournet/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ournet/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  gzip on;
  gzip_vary on;
}
